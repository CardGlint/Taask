<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Nick to-do list</title>
  <style>
    :root { color-scheme:dark; --ink:#f5f5f5; --muted:#a2a2a2; --line:#303030; --paper:#151515; --canvas:#090909; --red:#f05252; --yellow:#e4bb42; --green:#39bd7c; }
    * { box-sizing:border-box }
    body { margin:0; background:var(--canvas); color:var(--ink); font:15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button,input,select { font:inherit }
    .shell { width:min(760px,100%); margin:0 auto; min-height:100vh; padding:48px 28px 100px; }
    header { margin-bottom:29px }
    .eyebrow { color:var(--muted); font-size:11px; font-weight:650; letter-spacing:.14em; text-transform:uppercase; margin:0 0 7px }
    h1 { font-size:32px; letter-spacing:-.045em; margin:0; font-weight:680 }
    .date { color:var(--muted); margin-top:4px; font-size:14px }
    .overview { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:21px 22px 19px; box-shadow:0 2px 8px #0004; }
    .progress-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:11px }
    .progress-head strong { font-size:14px; font-weight:650 }
    .percent { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums }
    .track { height:7px; width:100%; background:#303030; border-radius:20px; overflow:hidden }
    .fill { height:100%; background:var(--green); border-radius:inherit; width:0; transition:width .25s ease }
    .stats { display:flex; flex-wrap:wrap; gap:7px 0; margin-top:15px; color:var(--muted); font-size:13px }
    .stats span+span::before { content:"·"; padding:0 9px; color:#686868 }
    .stats b { color:var(--ink); font-weight:650 }
    .list-head { display:flex; align-items:center; justify-content:space-between; margin:30px 1px 12px }
    .list-head h2 { margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em }
    .sort-label { color:var(--muted); font-size:12px }
    .tasks { display:grid; gap:9px }
    .task { display:grid; grid-template-columns:22px minmax(0,1fr) auto 12px; align-items:center; gap:13px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:0 0 0 15px; min-height:72px; overflow:hidden; transition:border-color .15s, transform .15s; }
    .task:hover { border-color:#555; transform:translateY(-1px) }
    .priority-band { grid-column:4; grid-row:1 / -1; width:12px; height:100%; min-height:70px; align-self:stretch; background:var(--priority-color,#666) }
    .task.priority-high { --priority-color:var(--red) } .task.priority-medium { --priority-color:var(--yellow) } .task.priority-low { --priority-color:var(--green) }
    .check { appearance:none; width:20px; height:20px; border:1.5px solid #777; border-radius:50%; margin:0; cursor:pointer; position:relative; transition:.15s }
    .check:hover { border-color:var(--ink) }
    .check:checked { background:var(--green); border-color:var(--green) }
    .check:checked::after { content:"✓"; color:white; font-size:12px; position:absolute; left:4px; top:0px }
    .task-name { min-width:0; overflow-wrap:anywhere; font-weight:550; letter-spacing:-.01em }
    .task-meta { display:flex; align-items:center; gap:11px; color:var(--muted); font-size:12px; white-space:nowrap }
    .priority { display:none }
    .duration { border-left:1px solid var(--line); padding-left:11px; font-variant-numeric:tabular-nums }
    .empty { text-align:center; padding:44px 20px; color:var(--muted); background:var(--paper); border:1px dashed #dcdcd8; border-radius:12px }
    .empty b { display:block; color:var(--ink); font-size:15px; margin-bottom:4px }
    .add-button { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:9px; border:0; border-radius:30px; background:#f5f5f5; color:#111; padding:12px 19px 12px 15px; box-shadow:0 8px 24px #0008; cursor:pointer; font-weight:600; }
    .add-button:hover { background:#dcdcdc }
    .plus { font-size:22px; line-height:16px; font-weight:350 }
    dialog { width:min(440px,calc(100% - 32px)); border:1px solid var(--line); border-radius:16px; padding:0; box-shadow:0 24px 80px #000b; color:var(--ink); background:#151515 }
    dialog::backdrop { background:#000b; backdrop-filter:blur(2px) }
    .dialog-inner { padding:23px }
    .dialog-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px }
    .dialog-title h2 { margin:0; font-size:19px; letter-spacing:-.03em }
    .close { border:0; background:transparent; font-size:22px; cursor:pointer; color:var(--muted); padding:0 3px }
    label { display:block; font-size:12px; font-weight:650; margin-bottom:7px }
    .field { margin-bottom:16px }
    input[type=text],input[type=number],select { display:block; width:100%; height:43px; border:1px solid #414141; border-radius:9px; padding:0 12px; background:#0b0b0b; color:var(--ink); outline:none }
    input:focus,select:focus { border-color:#999; box-shadow:0 0 0 3px #ffffff12 }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:13px }
    .submit { width:100%; background:#f5f5f5; border:0; color:#111; height:45px; border-radius:9px; font-weight:600; cursor:pointer; margin-top:3px }
    .submit:hover { background:#dcdcdc }
    h1[contenteditable="true"] { display:table; min-width:160px; border-radius:5px; outline:none; cursor:text }
    h1[contenteditable="true"]:focus { box-shadow:0 2px 0 var(--green) }
    @media (max-width:560px) {
      .shell { padding:33px 17px 100px }
      h1 { font-size:29px }
      .overview { padding:18px }
      .list-head { margin-top:25px }
      .task { grid-template-columns:21px minmax(0,1fr) auto 12px; gap:11px; padding:0 0 0 12px }
      .task-meta { grid-column:2 / 4; margin-top:-5px; gap:9px }
      .duration { padding-left:9px }
      .add-button { bottom:19px }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Your day, in focus</p>
      <h1 id="list-name" contenteditable="true" role="textbox" aria-label="List name" aria-multiline="false" spellcheck="false">Nick to-do list</h1>
      <div class="date" id="today"></div>
    </header>
    <section class="overview" aria-label="Task progress">
      <div class="progress-head"><strong>Today's progress</strong><span class="percent" id="percent">0%</span></div>
      <div class="track" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
      <div class="stats" id="stats"></div>
    </section>
    <div class="list-head"><h2>Remaining tasks</h2><span class="sort-label">Priority first</span></div>
    <section class="tasks" id="tasks" aria-live="polite"></section>
  </main>
  <button class="add-button" id="open-form" aria-label="Add a task"><span class="plus">+</span> Add task</button>
  <dialog id="task-dialog">
    <form class="dialog-inner" id="task-form">
      <div class="dialog-title"><h2>Add a task</h2><button type="button" class="close" id="close-form" aria-label="Close">×</button></div>
      <div class="field"><label for="task-name">Task</label><input id="task-name" name="name" type="text" maxlength="120" placeholder="What needs to get done?" required></div>
      <div class="form-row">
        <div class="field"><label for="priority">Priority</label><select id="priority" name="priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
        <div class="field"><label for="minutes">Time (minutes)</label><input id="minutes" name="minutes" type="number" min="1" max="1440" value="30" required></div>
      </div>
      <button class="submit" type="submit">Add to my list</button>
    </form>
  </dialog>
  <script>
    (() => {
      const KEY = 'daylist-v1';
      const TTL = 30 * 24 * 60 * 60 * 1000;
      const priorityOrder = { high: 0, medium: 1, low: 2 };
      const readState = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
          if (!saved || Date.now() > saved.expiresAt || !Array.isArray(saved.tasks)) return { tasks: [], completed: 0 };
          return { tasks: saved.tasks, completed: Number(saved.completed) || 0, listName: saved.listName || 'Nick to-do list' };
        } catch { return { tasks: [], completed: 0, listName: 'Nick to-do list' }; }
      };
      let state = readState();
      const save = () => localStorage.setItem(KEY, JSON.stringify({ ...state, expiresAt: Date.now() + TTL }));
      // Refresh the 30-day retention window each time the app opens.
      save();
      const $ = (selector) => document.querySelector(selector);
      const tasksEl = $('#tasks');
      const dialog = $('#task-dialog');
      $('#list-name').textContent = state.listName || 'Nick to-do list';
      document.title = `${state.listName || 'Nick to-do list'} — Daylist`;
      $('#list-name').addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); event.currentTarget.blur(); } });
      $('#list-name').addEventListener('input', (event) => {
        const name = event.currentTarget.textContent.replace(/[\r\n]+/g, ' ').trim();
        state.listName = name || 'Nick to-do list';
        document.title = `${state.listName} — Daylist`;
        save();
      });
      $('#list-name').addEventListener('blur', (event) => {
        if (!event.currentTarget.textContent.trim()) event.currentTarget.textContent = 'Nick to-do list';
        state.listName = event.currentTarget.textContent.trim(); save();
      });
      const prettyTime = (minutes) => minutes >= 60
        ? `${Math.floor(minutes / 60)}h${minutes % 60 ? ` ${minutes % 60}m` : ''}`
        : `${minutes}m`;
      const render = () => {
        const total = state.tasks.length + state.completed;
        const donePercent = total ? Math.round(state.completed / total * 100) : 0;
        const hours = state.tasks.reduce((sum, task) => sum + (Number(task.minutes) || 0), 0) / 60;
        $('#percent').textContent = `${donePercent}%`;
        $('#fill').style.width = `${donePercent}%`;
        $('.track').setAttribute('aria-valuenow', String(donePercent));
        const timeLabel = hours === 0 ? '0 hours' : `${Number.isInteger(hours) ? hours : hours.toFixed(1)} ${hours === 1 ? 'hour' : 'hours'}`;
        $('#stats').innerHTML = `<span><b>${state.tasks.length}</b> ${state.tasks.length === 1 ? 'task' : 'tasks'} remaining</span><span><b>${timeLabel}</b> left</span><span><b>${state.completed}</b> completed</span>`;
        const sorted = [...state.tasks].sort((a,b) => priorityOrder[a.priority] - priorityOrder[b.priority] || (Number(a.minutes) || 0) - (Number(b.minutes) || 0) || a.createdAt - b.createdAt);
        tasksEl.replaceChildren();
        if (!sorted.length) {
          const empty = document.createElement('div'); empty.className = 'empty';
          empty.innerHTML = '<b>You’re all caught up.</b>Add a task whenever something comes up.';
          tasksEl.append(empty); return;
        }
        for (const task of sorted) {
          const card = document.createElement('article'); card.className = `task priority-${['high','medium','low'].includes(task.priority) ? task.priority : 'medium'}`;
          const band = document.createElement('span'); band.className = 'priority-band'; band.setAttribute('aria-hidden', 'true');
          const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'check'; check.setAttribute('aria-label', `Complete ${task.name}`);
          check.addEventListener('change', () => { state.tasks = state.tasks.filter(item => item.id !== task.id); state.completed += 1; save(); render(); });
          const name = document.createElement('div'); name.className = 'task-name'; name.textContent = task.name;
          const meta = document.createElement('div'); meta.className = 'task-meta';
          const duration = document.createElement('span'); duration.className = 'duration'; duration.textContent = prettyTime(Number(task.minutes) || 0);
          meta.append(duration); card.append(check, name, meta, band); tasksEl.append(card);
        }
      };
      $('#today').textContent = new Intl.DateTimeFormat(undefined, { weekday:'long', month:'long', day:'numeric' }).format(new Date());
      $('#open-form').addEventListener('click', () => { dialog.showModal(); $('#task-name').focus(); });
      $('#close-form').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
      $('#task-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        state.tasks.push({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, name: String(form.get('name')).trim(), priority: String(form.get('priority')), minutes: Math.max(1, Number(form.get('minutes')) || 30), createdAt: Date.now() });
        save(); render(); event.currentTarget.reset(); $('#minutes').value = 30; dialog.close();
      });
      render();
    })();
  </script>
</body>
</html>
